<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brand check</title>
<link rel="stylesheet" href="../brand.css">
<script src="../lib/motion.js"></script>
<style>
  #stage {
    width: 1920px; height: 1080px; box-sizing: border-box;
    padding: 96px 128px 0;
    display: flex; flex-direction: column;
  }

  /* Header */
  header { display: flex; align-items: baseline; justify-content: space-between; }
  .title { display: flex; align-items: baseline; gap: 22px; }
  .title h1 { margin: 0; font-family: var(--font-display); font-weight: 700;
              font-size: 104px; letter-spacing: -0.01em; line-height: 1; color: var(--ink); }
  .title .script { font-family: var(--font-script); font-size: 118px; line-height: 1; color: var(--accent); }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 22px;
             letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  .rule { height: 2px; background: var(--ink); opacity: .18; margin: 36px 0 52px; transform-origin: left; }

  /* Swatches */
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; }
  .chip { height: 300px; border-radius: 22px; box-sizing: border-box; }
  .chip.bg { box-shadow: inset 0 0 0 2px rgba(94, 39, 80, .22); }
  .meta { margin-top: 22px; }
  .meta .name { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 1.05; color: var(--ink); }
  .meta .hex  { margin-top: 10px; font-family: var(--font-body); font-weight: 500; font-size: 26px;
                letter-spacing: .06em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .meta .role { margin-top: 6px; font-family: var(--font-body); font-size: 24px; color: var(--muted); }

  /* Type specimens */
  .type { margin-top: 60px; display: grid; grid-template-columns: 1.05fr 1.2fr 0.95fr; gap: 40px;
          border-top: 2px solid rgba(94, 39, 80, .18); padding-top: 34px; }
  .spec .label { font-family: var(--font-body); font-weight: 600; font-size: 18px;
                 letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .spec .sample { margin-top: 10px; line-height: 1.1; color: var(--ink); white-space: nowrap; }
  .spec.display .sample { font-family: var(--font-display); font-weight: 700; font-size: 64px; }
  .spec.display .sample i { font-weight: 500; }
  .spec.script .sample  { margin-top: 20px; font-family: var(--font-script); font-size: 76px; color: var(--accent); line-height: .95; }
  .spec.script .alt     { margin-top: 10px; font-family: var(--font-script-alt); font-size: 38px; color: var(--accent); white-space: nowrap; }
  .spec.script .alt span { font-family: var(--font-body); font-size: 16px; letter-spacing: .18em;
                           text-transform: uppercase; color: var(--muted); margin-left: 16px; vertical-align: 7px; }
  .spec.body .sample    { font-family: var(--font-body); font-weight: 400; font-size: 30px; line-height: 1.4; white-space: normal; }
  .spec.body .sample b  { font-weight: 700; }

  .reveal { will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="title reveal" id="title"><h1>Brand</h1><span class="script">check</span></div>
    <div class="eyebrow reveal" id="eyebrow">Colors &amp; Type</div>
  </header>
  <div class="rule" id="rule"></div>

  <div class="swatches" id="swatches"></div>

  <div class="type" id="type">
    <div class="spec display reveal">
      <div class="label">Headline · Playfair Display</div>
      <div class="sample">Aa Bb <i>Elegant</i> 123</div>
    </div>
    <div class="spec script reveal">
      <div class="label">Accent · Great Vibes</div>
      <div class="sample">With love &amp; care</div>
      <div class="alt">With love &amp; care<span>Alt · Dancing Script</span></div>
    </div>
    <div class="spec body reveal">
      <div class="label">Body · Inter</div>
      <div class="sample"><b>Clear, friendly body text</b> for every caption and detail.</div>
    </div>
  </div>
</div>

<script>
  window.DURATION = 5;
  window.SIZE = [1920, 1080];

  // Swatches read their hex codes straight from brand.css, so this video
  // always shows the real values, even after you change them.
  const css = getComputedStyle(document.documentElement);
  const colors = [
    { v: '--bg',     name: 'Beige', role: 'Background' },
    { v: '--ink',    name: 'Plum',  role: 'Text' },
    { v: '--accent', name: 'Black', role: 'Accent' },
    { v: '--muted',  name: 'Sage',  role: 'Muted' },
  ];
  const wrap = document.getElementById('swatches');
  for (const c of colors) {
    const hex = css.getPropertyValue(c.v).trim().toUpperCase();
    wrap.insertAdjacentHTML('beforeend', `
      <div class="swatch">
        <div class="chip ${c.v === '--bg' ? 'bg' : ''}" style="background:var(${c.v})"></div>
        <div class="meta reveal">
          <div class="name">${c.name}</div>
          <div class="hex">${hex}</div>
          <div class="role">${c.role} · ${c.v}</div>
        </div>
      </div>`);
  }

  const $ = s => document.querySelector(s);
  const chips = [...document.querySelectorAll('.chip')];
  const metas = [...document.querySelectorAll('.meta')];
  const specs = [...document.querySelectorAll('.spec')];
  const stage = $('#stage');

  // Fade + rise between [start, start + dur].
  const rise = (el, t, start, dur = 0.7, dist = 28) => {
    const p = M.easeOutCubic(M.progress(t, start, dur));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * dist}px)`;
  };

  window.render = (t) => {
    const { progress, easeOutExpo, easeInCubic, tween } = M;

    // Header
    rise($('#title'), t, 0.05, 0.8, 40);
    rise($('#eyebrow'), t, 0.25, 0.8, 20);
    $('#rule').style.transform = `scaleX(${easeOutExpo(progress(t, 0.3, 1.0))})`;

    // Swatches: each chip wipes up from its base, then its label rises.
    chips.forEach((el, i) => {
      const p = easeOutExpo(progress(t, 0.55 + i * 0.14, 0.9));
      el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0 round 22px)`;
      rise(metas[i], t, 0.8 + i * 0.14, 0.7, 22);
    });

    // Type specimens
    specs.forEach((el, i) => rise(el, t, 1.75 + i * 0.18, 0.8, 30));

    // Gentle exit in the last 0.4 s
    const out = tween(t, 4.6, 5.0, 0, 1, easeInCubic);
    stage.style.opacity = 1 - out;
  };
</script>
</body>
</html>
